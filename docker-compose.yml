version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "3100:5432"
    networks:
      - aurooms-network
  

  backend:
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      PORT: 8001
    depends_on:
      - db
    networks:
      - aurooms-network
    expose:
      - "8001"
  
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    depends_on:
      - db
    networks:
      - aurooms-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    networks:
      - aurooms-network
    restart: unless-stopped
    expose:
      - "8082"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/http.d/default.conf:ro
    networks:
      - aurooms-network

volumes:
  pgdata:

networks:
  aurooms-network:
    driver: bridge